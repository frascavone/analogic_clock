<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Analogic Clock</title>
	</head>
	<style>
		body {
			margin: 0;
			box-sizing: border-box;
			display: flex;
			min-height: 100dvh;
			justify-content: center;
			align-items: center;
			background: black;
			color: white;
		}

		.clock {
			position: relative;
			width: 300px;
			height: 300px;
			border: 1px solid white;
			border-radius: 50%;
		}

		.center {
			position: absolute;
			left: 50%;
			top: 50%;
			transform: translateX(-50%) translateY(-50%);
			width: 3%;
			height: 3%;
			border-radius: 50%;
			background-color: white;
		}

		.tick-wrapper {
			position: absolute;
			width: 100%;
			height: 100%;
			top: 0;
			left: 0;
			transform: rotate(var(--angle));
		}

		.tick {
			position: absolute;
			top: 0;
			left: 50%;
			transform: translateX(-50%);
			width: 1%;
			height: 8%;
			background: white;
		}

		.hours_hand {
			position: absolute;
			bottom: 50%;
			left: 50%;
			transform: translateX(-50%);
			width: 2%;
			height: 32%;
			background: white;
		}

		.minutes_hand {
			position: absolute;
			bottom: 50%;
			left: 50%;
			transform: translateX(-50%);
			width: 2%;
			height: 41%;
			background: white;
		}

		.seconds_hand {
			position: absolute;
			bottom: 50%;
			left: 50%;
			transform: translateX(-50%);
			width: 1%;
			height: 41.5%;
			background: white;
		}
	</style>
	<body>
		<div class="clock">
			<div class="tick-wrapper" style="--angle: 0deg"><div class="tick"></div></div>
			<div class="tick-wrapper" style="--angle: 30deg"><div class="tick"></div></div>
			<div class="tick-wrapper" style="--angle: 60deg"><div class="tick"></div></div>
			<div class="tick-wrapper" style="--angle: 90deg"><div class="tick"></div></div>
			<div class="tick-wrapper" style="--angle: 120deg"><div class="tick"></div></div>
			<div class="tick-wrapper" style="--angle: 150deg"><div class="tick"></div></div>
			<div class="tick-wrapper" style="--angle: 180deg"><div class="tick"></div></div>
			<div class="tick-wrapper" style="--angle: 210deg"><div class="tick"></div></div>
			<div class="tick-wrapper" style="--angle: 240deg"><div class="tick"></div></div>
			<div class="tick-wrapper" style="--angle: 270deg"><div class="tick"></div></div>
			<div class="tick-wrapper" style="--angle: 300deg"><div class="tick"></div></div>
			<div class="tick-wrapper" style="--angle: 330deg"><div class="tick"></div></div>
			<div class="center"></div>
			<div id="hours_hand" class="tick-wrapper" style="--angle: 0deg"><div class="hours_hand"></div></div>
			<div id="minutes_hand" class="tick-wrapper" style="--angle: 0deg"><div class="minutes_hand"></div></div>
			<div id="seconds_hand" class="tick-wrapper" style="--angle: 0deg"><div class="seconds_hand"></div></div>
		</div>
		<script>
			const hoursHand = document.getElementById("hours_hand");
			const minutesHand = document.getElementById("minutes_hand");
			const secondsHand = document.getElementById("seconds_hand");

			setInterval(() => {
				const now = new Date();
				const hours = now.getHours();
				const minutes = now.getMinutes();
				const seconds = now.getSeconds();

				const hourDeg = `${(hours % 12) * 30}deg`;
				const minDeg = `${(minutes * 36) / 6}deg`;
				const secDeg = `${(seconds * 36) / 6}deg`;

				hoursHand.style.setProperty("--angle", hourDeg);
				minutesHand.style.setProperty("--angle", minDeg);
				secondsHand.style.setProperty("--angle", secDeg);
			}, 1000);
		</script>
	</body>
</html>
